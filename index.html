<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      GitHub Pages: resolves ./assets/*.js when URL is /<repo> with no trailing slash.
      Must run before any relative script/CSS from the Vite build.
    -->
    <script>
      (function () {
        try {
          var p = window.location.pathname;
          if (!p || p === '/') return;
          var normalized = p.endsWith('/') ? p : p + '/';
          var b = document.createElement('base');
          b.href = normalized;
          var charsetMeta = document.querySelector('meta[charset]');
          if (charsetMeta && charsetMeta.parentNode) charsetMeta.after(b);
          else document.head.insertBefore(b, document.head.firstChild);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#185FA5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PSC PVP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="PSC PVP" />
    <title>OPSC — Priority Vacant Posts</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23185FA5'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="./icons/app-icon.svg" />
    <script>
      (function () {
        try {
          var k = 'psc-pvp-theme';
          var t = localStorage.getItem(k);
          if (t === 'dark') document.documentElement.classList.add('dark');
          else if (t === 'light') document.documentElement.classList.remove('dark');
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
